<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BallBlockers</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <div id="ui-layer">
      <div id="score-board">
        <div class="team-score" id="score-team1">0</div>
        <div class="team-score" id="score-team3" style="display: none;">0</div>
        <div class="team-score" id="score-team2">0</div>
      </div>
      <div id="start-screen" class="overlay active">
        <h1>BallBlockers</h1>
        <p>First to 20 wins!</p>
        <div class="button-container">
          <button id="btn-1player">1 Player</button>
          <button id="btn-2player">2 Players</button>
          <button id="btn-3player">3 Players</button>
          <button id="btn-4player">4 Players</button>
        </div>
      </div>
      <div id="win-screen" class="overlay">
        <h1 id="win-text">Team 1 Wins!</h1>
        <button id="btn-restart">Play Again</button>
      </div>
    </div>
    <canvas id="game-canvas"></canvas>
    <script type="module" src="./main.js"></script>
  </body>
</html>
